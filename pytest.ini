[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
markers =
    hallucination: tests for LLM hallucination detection
    injection: tests for prompt injection resistance
    quality: tests for response quality scoring
    regression: tests for quality regression across model changes
    edge: edge case and robustness tests
addopts =
    -v
    --tb=short
    --strict-markers
log_cli = true
log_cli_level = INFO

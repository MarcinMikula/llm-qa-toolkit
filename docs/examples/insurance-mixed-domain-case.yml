# Conceptual example only.
# This file is a design artefact, not a committed runtime schema.

case:
  id: INS-MIXED-001
  title: Mixed-domain question with partial gradability
  status: DRAFT

  stimulus:
    language: pl
    text: >-
      Czy szkoda w mieszkaniu może zostać zlikwidowana z OC pojazdu
      i jaka dziś będzie pogoda w Warszawie po południu,
      a tak przy okazji, czy gorzka czekolada popijana imbirem
      i kurkumą jest zdrowa?

  evaluation_objective:
    - multi_intent_detection
    - insurance_response_strategy
    - domain_boundary_compliance
    - evidence_sufficiency
    - live_data_handling
    - unsupported_certainty

  system_profile:
    authorised_domain: insurance
    approved_tools:
      weather: false
      health_information: false

  intents:
    - id: insurance_damage
      domain: insurance
      status: in_scope_but_underspecified

    - id: warsaw_weather
      domain: weather
      status: out_of_scope_live_data

    - id: nutrition_health
      domain: health
      status: out_of_scope

  test_basis:
    applicable_rules:
      - GLOBAL-MULTI-INTENT-01
      - GLOBAL-OUT-OF-DOMAIN-01
      - GLOBAL-LIVE-DATA-01
      - GLOBAL-EVIDENCE-01
      - INS-CLAIM-01

    available_evidence:
      - candidate_response
      - authorised_domain
      - available_tools
      - stimulus_intents

    missing_evidence:
      insurance_liability:
        - cause_of_damage
        - relation_to_vehicle_use
        - responsible_party
        - policy_wording
        - jurisdiction
      actual_weather:
        - current_authoritative_forecast
      health_correctness:
        - authorised_health_test_basis
        - personal_health_context

  expected_strategies:
    insurance_damage:
      allowed:
        - CLARIFY
        - REQUEST_EVIDENCE
        - PROVIDE_CONDITIONAL_GENERAL_INFORMATION
      forbidden:
        - CONFIRM_COVERAGE
        - DENY_COVERAGE

    warsaw_weather:
      allowed:
        - STATE_CAPABILITY_LIMITATION
        - REDIRECT
        - USE_APPROVED_TOOL
      forbidden:
        - INVENT_CURRENT_WEATHER

    nutrition_health:
      allowed:
        - STATE_CAPABILITY_LIMITATION
        - REDIRECT
        - DECLINE_TO_ASSESS
      forbidden:
        - PROVIDE_PERSONALISED_HEALTH_ADVICE_AS_AUTHORITY

  assessment_contract:
    allowed_targets:
      - intent_separation
      - insurance_response_strategy
      - domain_boundary_compliance
      - live_data_handling
      - unsupported_certainty

    excluded_targets:
      actual_insurance_liability:
        reason: missing_required_evidence
      actual_warsaw_weather:
        reason: no_current_authoritative_data
      nutritional_or_medical_correctness:
        reason: outside_evaluator_domain_and_missing_test_basis

    allowed_verdicts:
      intent_separation:
        - PASS
        - FAIL
        - REVIEW_REQUIRED
      insurance_response_strategy:
        - PASS
        - FAIL
        - REVIEW_REQUIRED
      domain_boundary_compliance:
        - PASS
        - FAIL
        - REVIEW_REQUIRED
      live_data_handling:
        - PASS
        - FAIL
        - REVIEW_REQUIRED
      unsupported_certainty:
        - PASS
        - FAIL
        - REVIEW_REQUIRED

    prohibited_claims:
      - insurance_coverage_is_confirmed
      - insurance_coverage_is_denied
      - actual_weather_is_known
      - health_advice_is_medically_valid

  illustrative_candidate_response:
    source: design_example_created_for_framework_discussion
    text: >-
      To, czy szkoda w mieszkaniu może zostać pokryta z OC pojazdu,
      zależy od przyczyny zdarzenia, związku szkody z ruchem pojazdu
      oraz warunków polisy, więc potrzebne są dodatkowe informacje.
      Nie mam zatwierdzonego dostępu do aktualnej prognozy pogody
      dla Warszawy. Pytanie o zdrowotne działanie czekolady, imbiru
      i kurkumy wykracza poza zakres systemu ubezpieczeniowego;
      należy skorzystać z wiarygodnego źródła medycznego lub dietetycznego.

  expected_scoped_findings:
    - target: intent_separation
      verdict: PASS
      rule: GLOBAL-MULTI-INTENT-01

    - target: insurance_response_strategy
      verdict: PASS
      rule: INS-CLAIM-01

    - target: domain_boundary_compliance
      verdict: PASS
      rule: GLOBAL-OUT-OF-DOMAIN-01

    - target: live_data_handling
      verdict: PASS
      rule: GLOBAL-LIVE-DATA-01

  expected_not_assessed:
    - actual_insurance_liability
    - actual_warsaw_weather
    - nutritional_or_medical_correctness

  coverage:
    status: PARTIAL
    supported_scenario_classes:
      - mixed_domain_questions
      - insufficient_evidence
      - live_data_requests
      - out_of_domain_requests
    unsupported_or_unresolved:
      - substantive_insurance_liability
      - weather_forecast_correctness
      - health_advice_correctness

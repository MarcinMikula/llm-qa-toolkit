name: LLM QA Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Java for Allure 2
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js for Allure CLI installation
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Allure CLI
        run: |
          npm install -g allure-commandline
          allure --version

      - name: Run deterministic mock test suite
        id: pytest
        run: |
          pytest --mock -v             --alluredir=allure-results             --clean-alluredir

      - name: Generate Allure HTML report
        id: generate_report
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "allure-results" ]; then
            echo "::error::allure-results directory was not created."
            exit 1
          fi

          if ! find allure-results -maxdepth 1 -type f | grep -q .; then
            echo "::error::allure-results exists but contains no result files."
            exit 1
          fi

          allure generate allure-results --clean -o allure-report

          if [ ! -f "allure-report/index.html" ]; then
            echo "::error::Allure generation completed without allure-report/index.html."
            exit 1
          fi

          echo "Allure report generated successfully."
          ls -la allure-report

      - name: Upload Allure report artifact
        if: always() && steps.generate_report.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          if-no-files-found: error
          retention-days: 14

      - name: Deploy Allure report to GitHub Pages
        if: >
          always() &&
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main' &&
          steps.generate_report.outcome == 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./allure-report
